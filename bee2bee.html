<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HNY833 | Bee2Bee</title>
  <style>
    :root {
      --bg: #05070a;
      --hex-base: rgba(255, 200, 0, 0.02);
      --hex-stroke: rgba(255, 200, 0, 0.08);
      --glow-start: #FFD700;
      --glow-mid: #FFA500;
      --glow-end: #FFF8DC;
      --text: #f0f0f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      /* Ensure no scrollbars */
      overscroll-behavior: none;
    }

    .scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: auto; /* Crucial for GitHub Pages */
    }

    .hex-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .hex {
      fill: var(--hex-base);
      stroke: var(--hex-stroke);
      stroke-width: 0.8;
      transition: filter 0.15s ease;
      filter: none;
      will-change: fill, stroke, filter;
    }

    .content {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      pointer-events: none; /* Let clicks pass through to hexes */
      width: 100%;
      padding: 0 20px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--glow-start), var(--glow-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
      margin-bottom: 0.5rem;
      line-height: 1.1;
    }

    p {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    @media (max-width: 768px) {
      h1 { font-size: 3rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>

<body>
  <div class="scene">
    <div class="hex-layer" id="layer1"></div>
    <div class="hex-layer" id="layer2"></div>
    <div class="hex-layer" id="layer3"></div>
  </div>

  <div class="content">
    <h1>HNY833</h1>
    <p>Technology Solutions for Tomorrow.</p>
  </div>

  <script>
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', () => {
      const layers = [
        document.getElementById('layer1'),
        document.getElementById('layer2'),
        document.getElementById('layer3')
      ];

      const R = 20;
      const W = Math.sqrt(3) * R;
      const V = 1.5 * R;
      const INFLUENCE = 150;
      const ADD_STRENGTH = 0.25;
      const DECAY = 1.5;
      const MAX_INTENSITY = 1.2;

      let hexData = [];
      let pointer = { x: null, y: null, inside: false };
      let raf = null;
      let lastT = performance.now();

      function pointsForHex(cx, cy, r) {
        const pts = [];
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI / 180) * (60 * i - 30);
          pts.push(`$${(cx + r * Math.cos(a)).toFixed(2)},$${(cy + r * Math.sin(a)).toFixed(2)}`);
        }
        return pts.join(" ");
      }

      function buildLayer(layerIndex, layerEl) {
        const scale = 1 - layerIndex * 0.15;
        const offset = layerIndex * 20;
        const rect = layerEl.getBoundingClientRect();
        const cols = Math.ceil(rect.width / W) + 4;
        const rows = Math.ceil(rect.height / V) + 4;

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const xOffset = (row % 2) ? W / 2 : 0;
            const cx = (col * W + xOffset) * scale + offset;
            const cy = (row * V) * scale + offset;

            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute("points", pointsForHex(cx, cy, R * scale));
            poly.classList.add("hex");
            layerEl.appendChild(poly);

            hexData.push({
              layer: layerIndex,
              cx, cy,
              el: poly,
              intensity: 0
            });
          }
        }
      }

      function init() {
        layers.forEach((layer, i) => {
          layer.innerHTML = '';
          buildLayer(i, layer);
        });
        resize();
        window.addEventListener('resize', resize);
        startLoop();
      }

      function resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        layers.forEach(layer => {
          layer.style.width = `${w}px`;
          layer.style.height = `${h}px`;
        });
      }

      function clamp(v, min, max) {
        return v < min ? min : (v > max ? max : v);
      }

      function updateHex(h) {
        const t = clamp(h.intensity / MAX_INTENSITY, 0, 1);
        const fillAlpha = 0.02 + t * 0.35;
        const strokeAlpha = 0.08 + t * 0.85;
        const blur = t * 12;

        h.el.style.fill = `rgba(255, ${215 - 50 * t}, 0, ${fillAlpha.toFixed(3)})`;
        h.el.style.stroke = `rgba(255, ${230 - 40 * t}, 200, ${strokeAlpha.toFixed(3)})`;
        h.el.style.filter = t > 0.15 ? `blur(${blur}px) drop-shadow(0 0 ${blur * 2}px rgba(255, ${215 - 50 * t}, 0))` : 'none';
      }

      function addInfluence(px, py) {
        const r2 = INFLUENCE * INFLUENCE;
        hexData.forEach(h => {
          const dx = h.cx - px;
          const dy = h.cy - py;
          const d2 = dx * dx + dy * dy;
          if (d2 > r2) return;

          const t = 1 - (d2 / r2);
          const w = t * t * t;
          h.intensity = clamp(h.intensity + ADD_STRENGTH * w * (1 - h.layer * 0.2), 0, MAX_INTENSITY);
        });
      }

      function loop(now) {
        const dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;

        if (pointer.inside && pointer.x != null && pointer.y != null) {
          addInfluence(pointer.x, pointer.y);
        }

        let active = false;
        hexData.forEach(h => {
          if (h.intensity > 0) {
            h.intensity = Math.max(0, h.intensity - DECAY * dt);
            active = true;
          }
          updateHex(h);
        });

        if (active || pointer.inside) {
          raf = requestAnimationFrame(loop);
        } else {
          raf = null;
        }
      }

      function startLoop() {
        if (!raf) {
          lastT = performance.now();
          raf = requestAnimationFrame(loop);
        }
      }

      function setPointer(e) {
        const rect = layers[0].getBoundingClientRect();
        pointer.x = e.clientX - rect.left;
        pointer.y = e.clientY - rect.top;
      }

      layers.forEach(layer => {
        layer.addEventListener('pointerenter', (e) => {
          pointer.inside = true;
          setPointer(e);
          startLoop();
        });
        layer.addEventListener('pointermove', (e) => {
          pointer.inside = true;
          setPointer(e);
          startLoop();
        });
        layer.addEventListener('pointerleave', () => {
          pointer.inside = false;
          startLoop();
        });
      });

      init();
    });
  </script>
</body>
</html>
